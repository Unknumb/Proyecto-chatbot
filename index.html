<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot epico</title>
    <link rel="stylesheet" href="/Project/frontend/01-chatgpt-local/styles.css">
    <link rel="icon" href="/Project/frontend/images/logo chatboooot.png">
</head>
<body>
    <!--PRUEBA AUTOMATIZACIOOOON-->
    <img class="logo" src="/Project/frontend/images/logo chatboooot.png" alt="Logo del ChatBot">
    <main>
        <ul>
            <li class="loading">
                <i></i>
                <h4>Cargandooooo</h4>
                <h5>Esto puede tardar un poco.</h5>
            </li>
        </ul>
    </main>

    <form>
        <input placeholder="Escribe tu mensaje aqui">
        <button disabled>Enviar</button>
    </form>


    <button id="clear-history" class="delete-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Borrar Historial
    </button>

    <small>&nbsp;</small>

    <template id="message-template">
        <li class="message">
            <span></span>
            <p></p>
        </li>
    </template>

    <script type="module" src="/Project/frontend/01-chatgpt-local/script.js"></script>

    <!--PRUEBA dsadad-->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot epico</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 
            'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: radial-gradient(circle at center, 
                          #e0e8ff 0%, 
                          #c9d4ff 30%, 
                          #a5b6ff 60%, 
                          #c9d4ff 90%);
            display: grid;
            place-content: center;
            height: 100dvh;
            animation: gradientPulse 15s ease infinite alternate;
        }

        @keyframes gradientPulse {
            0% {
                background-size: 100% 100%;
            }
            50% {
                background-size: 150% 150%;
            }
            100% {
                background-size: 100% 100%;
            }
        }
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
        }

        main {
            width: 400px;
            max-width: 100%;
            height: 70vh;

            background: #ffff;
            border: 1px solid #cccc;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 8px;
            margin-bottom: 16px;

            overflow-y: auto;
            scroll-behavior: smooth;
        }

        ul {
            display: flex;
            flex-direction: column;
            list-style: none;
            padding: 0;

        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 4px 0;
            padding: 4px 8px;

            > span {
                width: 36px;
                height: 36px;
                background: #eee;
                font-size: 12px;
                font-weight: 500;
                display: flex;
                justify-content: center;
                align-items: center;
                border-radius: 999999px;
            }

            > p {
                border-radius: 4px;
                padding: 4px 8px;
                margin-top: 8px;
            }

            &.user {
                align-self: flex-end;
                align-items: flex-end;
                span, p{
                    background: rgb(200, 185, 244);
                }
            }

            &.bot {
                align-self: flex-start;
                span, p {
                background: rgb(168, 183, 253);
                }
            } 
        }

        form {
            display: flex;

            input {
                border-radius: 999999px;
                flex-grow: 1;
                border: 0;
                padding: 8px;
                margin-right: 8px;
                border: 1px solid #ccc;
            }

            button {
                background: #09f;
                border: 0;
                color: white;
                border-radius: 6px;
                cursor: pointer;
                padding: 8px;
                transition: background .3s ease;

                &[disabled] {
                    background: #ccc;
                    opacity: .6;
                    pointer-events: none;
                }

                &:hover {
                    background: rgb(0, 104, 173);
                }

                &.stop {
                    background: #f44336 !important;
                }

                &.stop:hover {
                    background: #d32f2f !important;
                }
            }
        }

        small {
            font-size: 10px;
            color: #555;
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            margin: auto;
            width: 400px;
        }

        .loading {
        text-align: center;
        display: flex;
        justify-content: center;
        height: 100%;
        align-items: center;
        flex-direction: column;
        margin-top: 50%;

        i {
            pointer-events: none;
            width: 2.5em;
            height: 2.5em;
            border: 0.4em solid transparent;
            border-color: #eee;
            border-top-color: #3e9eec;
            border-radius: 50%;
            animation: loadingspin 1s linear infinite;
        }

        h4 {
            color: #444;
            margin-bottom: 8px;
        }

        h5 {
            font-weight: 400;
            margin: 0;
            font-size: 10px;
            opacity: .4;
        }
        }


        @keyframes loadingspin {
            100% {
                transform: rotate(360deg)
            }
        }
    </style>
    <script type="module">
        import { CreateWebWorkerMLCEngine } from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.46/+esm"

        const $ = el => document.querySelector(el)

        // pongo delante de la variable un símbolo de $
        // para indicar que es un elemento del DOM
        const $form = $('form')
        const $input = $('input')
        const $template = $('#message-template')
        const $messages = $('ul')
        const $container = $('main')
        const $button = $('button')
        const $info = $('small')
        const $loading = $('.loading')

        let messages = []
        let end = false
        let isGenerating = false
        let currentGeneration = null

        const SELECTED_MODEL = 'Llama-3-8B-Instruct-q4f32_1-MLC-1k'

        const engine = await CreateWebWorkerMLCEngine(
        new Worker('./worker.js', { type: 'module' }),
        SELECTED_MODEL,
        {
            initProgressCallback: (info) => {
                $info.textContent = info.text
                    if(info.progress === 1 && !end) {
                    end = true
                    $loading?.parentNode?.removeChild($loading)
                    $button.removeAttribute('disabled')
                    addMessage("¡Hola! Soy un ChatBot que se ejecuta completamente en tu navegador. ¿En qué puedo ayudarte hoy?", 'bot')
                    $input.focus()
                    }
                }
            }
        )

        $form.addEventListener('submit', async (event) => {
            event.preventDefault()
            const messageText = $input.value.trim()

            if(messageText === '' || isGenerating) return

            $input.value = ''
            $input.setAttribute('disabled', '') // 👈 Deshabilitar input
            addMessage(messageText, 'user')
            
            $button.textContent = 'Stop'
            $button.classList.add('stop')
            isGenerating = true

            const userMessage = {
                role : 'user',
                content: messageText
            }

            messages.push(userMessage)

            try {
                currentGeneration = engine.chat.completions.create({
                    messages,
                    stream: true
                })

                const chunks = await currentGeneration

                let reply = ""
                const $botMessage = addMessage("", 'bot')
                
                for await (const chunk of chunks) {
                    if (!isGenerating) break
                    
                    const [choice] = chunk.choices

                    const content = choice?.delta?.content ?? ""
                    reply += content
                    $botMessage.innerHTML = formatMarkdown(reply)
                }

                messages.push({
                    role: 'assistant',
                    content: reply
                })
            } finally {
                isGenerating = false
                currentGeneration = null
                $button.textContent = 'Enviar'
                $button.classList.remove('stop')
                $input.removeAttribute('disabled') // 👈 Habilitar input
                $container.scrollTop = $container.scrollHeight
            }
        })

        $button.addEventListener('click', function(event) {
            if (isGenerating) {
                event.preventDefault()
                isGenerating = false
                $button.textContent = 'Enviar' //
                $button.classList.remove('stop') //
                $input.removeAttribute('disabled') // 👈 Habilitar input si se cancela
            }
        })

        function addMessage(text, sender) {
            const clonedTemplate = $template.content.cloneNode(true)

            const $newMessage = clonedTemplate.querySelector('.message')
            const $who = $newMessage.querySelector('span')
            const $text = $newMessage.querySelector('p')

            $text.innerHTML = formatMarkdown(text)
            $who.textContent = sender == 'bot' ? 'GPT' : 'Tu'
            $newMessage.classList.add(sender)

            $messages.appendChild($newMessage)
            $container.scrollTop = $container.scrollHeight

            return $text
        }

        function formatMarkdown(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`{3}([\s\S]*?)`{3}/g, '<pre><code>$1</code></pre>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
        }
    </script>

    <link rel="icon" href="/Proyecto-chatbot/Project/frontend/images/logo chatboooot.png">
</head>
<body>
    <!-- CREAR NUESTRO CHAT GPT-->
    <img class="logo" src="/Project/frontend/images/logo chatboooot.png" alt="Logo del ChatBot">
    
    <main>
        <ul>
            <li class="loading">
                <i></i>
                <h4>Cargandooooo</h4>
                <h5>Esto puede tardar un poquito.</h5>
            </li>
        </ul>
    </main>

    <form>
        <input placeholder="Escribe tu mensaje aqui">
        <button disabled>Enviar</button>
    </form>

    <small>&nbsp;</small>

    <template id="message-template">
        <li class="message">
            <span></span>
            <p></p>
        </li>
    </template>

</body>
</html>
